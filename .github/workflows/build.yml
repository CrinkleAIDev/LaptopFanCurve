name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app and release zip
        shell: cmd
        run: build.cmd

      - name: Run tests (no hardware needed)
        shell: cmd
        run: tests\run_tests.cmd

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: LaptopFanCurve-win-x64
          path: dist/*.zip
